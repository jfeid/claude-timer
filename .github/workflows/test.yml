name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  timer-sh:
    name: timer.sh on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Tool versions
        shell: bash
        run: |
          bash --version | head -1
          date --version 2>/dev/null | head -1 || echo "date: not GNU (BSD)"
          jq --version || echo "jq: missing"
      - name: Test timer.sh
        shell: bash
        run: bash tests/timer-cli.sh

  mod:
    name: plugin validation and mod tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code && claude --version
      - name: Validate
        run: claude plugin validate --strict .
      - name: Mod tests
        run: claude plugin test .
